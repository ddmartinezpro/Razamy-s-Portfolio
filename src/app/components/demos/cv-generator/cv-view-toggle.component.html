<fieldset class="format-toggle">
  <legend>{{ texts().format }}</legend>
  <label>
    <input type="radio" name="cv-format" value="visual" [checked]="format() === 'visual'" (change)="format.set('visual')">
    {{ texts().visualFormat }}
  </label>
  <label>
    <input type="radio" name="cv-format" value="aws" [checked]="format() === 'aws'" (change)="format.set('aws')">
    {{ texts().awsFormat }}
  </label>
</fieldset>
