<footer class="footer">
  <span>© {{ year }} {{ contact.name }}</span>
  <a [href]="'mailto:' + contact.email">{{ contact.email }}</a>
  <a [href]="contact.linkedinUrl" target="_blank" rel="noreferrer">{{ content().contactActions.linkedin }}</a>
  <a [href]="contact.githubUrl" target="_blank" rel="noreferrer">{{ content().contactActions.github }}</a>
</footer>
